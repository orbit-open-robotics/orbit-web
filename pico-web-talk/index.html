<!DOCTYPE html>
<html>

<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.1.0/paho-mqtt.min.js"></script>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Hero -->
    <div class="hero">
        <h1>Pico Web Talk</h1>
        <p>Send and receive messages to a Pico.</p>
    </div>

    <div id="status" class="disconnected">Disconnected from broker</div>

    <!-- Send Message Section -->
    <div class="send_section">
        <label for="subcribe_topic">Subscribe Topic:</label>
        <input type="text" id="subcribe_topic">

        <label for="message"></label>
        <input id="message" type="text" placeholder="Type a message">
        <button id="send-btn" onclick="send()">Send to Pico</button>
        <br>
    </div>


    <!-- Log section -->
    <h3>Log</h3>
    <div id="log"></div>
    <button id="clear-log-btn" onclick="clearLog()">Clear Log</button>


</body>

</html>
